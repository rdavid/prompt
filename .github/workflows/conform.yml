#
# Enforces the Conventional Commits format. On a pull request every commit
# ahead of the base branch is checked. The --base-branch flag of conform needs
# the base ref locally, which fetch-depth 0 guarantees. The checkout ref is
# pinned to the PR head SHA, so HEAD is the real last commit and not GitHub's
# synthetic merge commit, whose auto-generated message fails Conventional
# Commits. On a direct push to master only the landed commit is checked. The
# branching reads GITHUB_EVENT_NAME and GITHUB_BASE_REF as plain runner
# environment variables, not template-expanded strings, which keeps it free of
# template injection. The conform tool has no stable release yet, so the pin
# below tracks the latest alpha.
---
name: conform
'on':
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: sh
jobs:
  conform:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - run: |
          srv=https://github.com/siderolabs/conform
          sum=a901c01b69abf349d250acfb5bb6846300f29e343b9a6f7baf7edb22f218b098
          ver=0.1.0-alpha.33
          url=$srv/releases/download/v$ver/conform-linux-amd64
          curl \
            --fail \
            --location \
            --output conform \
            --retry 3 \
            --show-error \
            --silent \
            "$url"
          printf '%s  %s\n' "$sum" conform | sha256sum --check --status
          chmod +x conform
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            ./conform enforce --base-branch "origin/$GITHUB_BASE_REF"
          else
            ./conform enforce --commit-ref HEAD
          fi
