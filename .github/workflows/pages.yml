#
# Builds README.txt into the project's GitHub Pages site. The deploy job's
# pages:write permission publishes the built site, and id-token:write
# OIDC-authenticates the deployment.
---
name: pages
'on':
  push:
    branches: [master]
    paths:
      - README.txt
      - .github/pages/**
      - .github/workflows/pages.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
defaults:
  run:
    shell: sh
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes pandoc
      - run: |
          mkdir _site
          cp .github/pages/favicon.svg _site/favicon.svg
          { printf '~~~~\n'; cat README.txt; printf '~~~~\n'; } |
            pandoc \
              --from markdown \
              --to html5 \
              --standalone \
              --metadata pagetitle=prompt \
              --include-in-header .github/pages/README-header.html \
              --include-before-body .github/pages/README-before.html \
              --include-after-body .github/pages/README-after.html \
              --output _site/index.html
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: _site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
