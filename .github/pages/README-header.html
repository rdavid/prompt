<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root {
  --bg: #3f3f3f;
  --bg-panel: #2b2b2b;
  --fg: #dcdccc;
  --fg-muted: #7f9f7f;
  --accent-yellow: #f0dfaf;
  --accent-orange: #dfaf8f;
  --accent-cyan: #8cd0d3;
  --border: #4f4f4f;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
body {
  background: var(--bg);
  color: var(--fg);
  max-width: 900px;
  margin: 0 auto;
  padding: 2em 15px 1em;
  font-family: var(--mono);
  line-height: 1.6;
}
a { color: var(--accent-orange); }
a:hover { color: var(--accent-cyan); }
code, pre { font-family: var(--mono); }
code {
  background: var(--bg-panel);
  color: var(--accent-cyan);
  padding: 0.1em 0.3em;
}
pre {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  padding: 0.8em 1em;
  white-space: pre-wrap;
  color: var(--accent-cyan);
}
pre code { padding: 0; }
html { background: var(--bg); }
body { padding-top: 4em; }
#site-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  max-width: 900px;
  margin: 0 auto;
  padding: 0.9em 15px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  font-size: 0.92em;
  z-index: 10;
}
#site-header .name {
  font-weight: 700;
  color: var(--accent-yellow);
  background: url("favicon.svg") no-repeat left center;
  background-size: 1.15em 1.15em;
  padding-left: 1.6em;
  line-height: 1.15em;
}
#site-header a {
  display: flex;
  color: var(--fg-muted);
}
#site-header a:hover { color: var(--accent-orange); }
#site-header svg { width: 1.15em; height: 1.15em; }
#site-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 1em;
  margin: 3em 0 0;
  padding: 1.5em 0 0.5em;
  border-top: 1px solid var(--border);
  font-size: 0.85em;
  color: var(--fg-muted);
}
#site-footer .footer-left {
  display: flex;
  align-items: center;
  gap: 0.6em;
}
#site-footer .footer-left img { display: block; }
#site-footer .footer-left a { color: var(--accent-orange); }
#site-footer .footer-links { display: flex; gap: 1.4em; }
#site-footer .footer-links a {
  color: var(--fg-muted);
  text-decoration: none;
}
#site-footer .footer-links a:hover { color: var(--accent-orange); }
</style>
